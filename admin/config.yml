backend:
  name: git-gateway
  branch: main
locale: bn
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: site
    label: ওয়েবসাইট কনটেন্ট
    files:
      - label: সম্পূর্ণ ওয়েবসাইট
        name: home
        file: content/site.json
        fields:
          - {label: নাম, name: name, widget: string}
          - {label: পেশা/টাইটেল, name: role, widget: string}
          - {label: ভূমিকা (হিরো লেখা), name: intro, widget: text}
          - {label: হিরো ছবি, name: hero_image, widget: image}
          - {label: পরিচিতি শিরোনাম, name: about_title, widget: string}
          - {label: পরিচিতি লেখা, name: about_text, widget: text}
          - {label: পরিচিতি ছবি, name: about_image, widget: image}
          - label: পরিসংখ্যান
            name: stats
            widget: list
            fields:
              - {label: সংখ্যা, name: number, widget: string}
              - {label: লেবেল, name: label, widget: string}
          - label: সার্ভিস
            name: services
            widget: list
            fields:
              - {label: "আইকন (Font Awesome ক্লাস)", name: icon, widget: string, default: "fa-solid fa-star"}
              - {label: শিরোনাম, name: title, widget: string}
              - {label: বিবরণ, name: text, widget: text}
          - label: দক্ষতা
            name: skills
            widget: list
            fields:
              - {label: নাম, name: name, widget: string}
              - {label: "শতাংশ (০-১০০)", name: level, widget: number, min: 0, max: 100}
          - label: প্রজেক্ট
            name: projects
            widget: list
            fields:
              - {label: শিরোনাম, name: title, widget: string}
              - {label: ক্যাটেগরি, name: tag, widget: string}
              - {label: ছবি, name: image, widget: image, required: false}
              - {label: কনসেপ্ট ডিজাইন? (টিক দিলে Concept লেখা দেখাবে), name: demo, widget: boolean, default: false, required: false}
              - {label: ডেমো কার্ডের রঙ (যেমন #0e7c66), name: color, widget: string, required: false}
              - {label: লাইভ ওয়েবসাইট লিংক (আসল প্রজেক্ট হলে), name: link, widget: string, required: false}
              - {label: প্রিভিউ হেডলাইন (কনসেপ্ট), name: headline, widget: string, required: false}
              - {label: প্রিভিউ সাব-লাইন (কনসেপ্ট), name: sub, widget: string, required: false}
              - {label: প্রিভিউ ফিচার (৩টি), name: features, widget: list, required: false, field: {label: ফিচার, name: feature, widget: string}}
          - label: রিভিউ
            name: reviews
            widget: list
            fields:
              - {label: নাম, name: name, widget: string}
              - {label: রিভিউ, name: text, widget: text}
          - {label: ইমেইল, name: email, widget: string}
          - {label: ফোন নম্বর, name: phone, widget: string}
          - {label: ফেসবুক লিংক (ঐচ্ছিক), name: facebook, widget: string, required: false}
          - {label: লিংকডইন লিংক (ঐচ্ছিক), name: linkedin, widget: string, required: false}
