backend:
  name: git-gateway
  branch: main
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "site"
    label: "Website Content"
    files:
      - label: "Whole Website"
        name: "home"
        file: "content/site.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role / Title", name: "role", widget: "string" }
          - { label: "Hero intro text", name: "intro", widget: "text" }
          - { label: "Hero image", name: "hero_image", widget: "image" }
          - { label: "About heading", name: "about_title", widget: "string" }
          - { label: "About text", name: "about_text", widget: "text" }
          - { label: "About image", name: "about_image", widget: "image" }
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Icon (Font Awesome class)", name: "icon", widget: "string", default: "fa-solid fa-star" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "text", widget: "text" }
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Level (0 to 100)", name: "level", widget: "number", min: 0, max: 100 }
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "tag", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Concept design? (tick to show the Concept label)", name: "demo", widget: "boolean", default: false, required: false }
              - { label: "Card colour for concept (example: #0e7c66)", name: "color", widget: "string", required: false }
              - { label: "Live website link (for real projects)", name: "link", widget: "string", required: false }
              - { label: "Preview headline (concept)", name: "headline", widget: "string", required: false }
              - { label: "Preview subline (concept)", name: "sub", widget: "string", required: false }
              - { label: "Preview features (3 items)", name: "features", widget: "list", required: false, field: { label: "Feature", name: "feature", widget: "string" } }
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Review", name: "text", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Facebook link (optional)", name: "facebook", widget: "string", required: false }
          - { label: "LinkedIn link (optional)", name: "linkedin", widget: "string", required: false }
